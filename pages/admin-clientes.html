<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrismaDesk - Clientes</title>


    <link rel="stylesheet" href="../css/sidebar.css">
        <link rel="stylesheet" href="../css/clientes.css">

</head>


<body>


    <aside id="sidebar"></aside>



    <main class="content">


        <header class="topbar">


            <div>

                <h1>
                    Clientes
                </h1>


                <p id="total-clientes"></p>

            </div>



            <div class="top-actions">


                <!-- <button onclick="location.href='cadastroCliente.html'"> -->

                    <!-- Novo Cliente -->

                <!-- </button> -->


            </div>

<!-- 1. Altere o seu botão "Novo Cliente" para isso -->
<button type="button" id="btnAbrirModal">Novo Cliente</button>

<!-- Modal de Cadastro com Estilo PrismaDesk -->
<div id="modalCliente" class="prismadesk-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Cadastrar Novo Cliente</h2>
            <button type="button" id="btnFecharModalX" class="close-x">&times;</button>
        </div>
        
        <form id="formCadastroCliente">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" placeholder="Digite o nome completo" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="Ex: 81999999999" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>
            
            <div class="modal-actions">
                <button type="button" id="btnFecharModal" class="btn-secondary">Cancelar</button>
                <button type="submit" class="btn-primary">Salvar Cliente</button>
            </div>
        </form>
    </div>
</div>




        </header>




        <section id="lista-clientes" class="cards">


        </section>




    </main>



    <script src="../js/sidebar.js"></script>

    <script src="../js/api.js"></script>

    <script src="../js/admin-clientes.js"></script>


</body>

</html>
