<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrismaDesk - Chamados</title>

    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/chamados.css">

</head>


<body>


    <aside id="sidebar"></aside>



    <main class="content">


        <header class="topbar">


            <div>

                <h1>
                    Chamados Ativos
                </h1>


                <p id="total-chamados"></p>

            </div>



            <div class="top-actions">


                <input
                    id="buscaChamado"
                    type="text"
                    placeholder="Buscar chamado..."
                >



                <select id="filtroStatus">


                    <option value="todos">
                        Todos
                    </option>


                    <option value="aberto">
                        Aberto
                    </option>


                    <option value="em andamento">
                        Em andamento
                    </option>


                    <option value="fechado">
                        Fechado
                    </option>


                </select>



                <button onclick="window.location.href='abrirChamado.html'">

                    Novo Chamado

                </button>



            </div>


        </header>




        <section id="lista-chamados" class="cards">


        </section>




    </main>



    <script src="../js/sidebar.js"></script>

    <script src="../js/api.js"></script>

    <script src="../js/chamados.js"></script>


</body>

</html>
