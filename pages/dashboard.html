<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrismaDesk - Dashboard</title>

    <link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/sidebar.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <aside id="sidebar"></aside>

    <main class="content">

        <header class="dashboard-header">
            <h1>Dashboard PrismaDesk</h1>
            <p>Visão geral do sistema de Ordem de Serviço</p>
        </header>



            <section class="cards">

                <div class="card">
                    <h3>Chamados Abertos</h3>
                    <span id="chamadosAbertos">0</span>
                </div>

                <div class="card">
                    <h3>Chamados Fechados</h3>
                    <span id="chamadosFechados">0</span>
                </div>

                <div class="card">
                    <h3>Clientes</h3>
                    <span id="clientes">0</span>
                </div>

                <div class="card">
                    <h3>Técnicos</h3>
                    <span id="tecnicos">0</span>
                </div>

            </section>

            <section class="graficos">

                <div class="grafico-box">
                    <h2>Status dos Chamados</h2>
                    <canvas id="graficoStatus"></canvas>
                </div>

                <div class="grafico-box">
                    <h2>Categorias</h2>
                    <canvas id="graficoCategoria"></canvas>
                </div>

            </section>

            <section class="tabelas">

                <div class="tabela-box">

                    <h2>Últimos Chamados</h2>

                    <table>

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Cliente</th>
                                <th>Status</th>
                            </tr>
                        </thead>

                        <tbody id="ultimosChamados">
                        </tbody>

                    </table>

                </div>

                <div class="atividade-box">

                    <h2>Atividades Recentes</h2>

                    <ul id="atividadesRecentes">

                        <li>Dashboard carregado</li>

                    </ul>

                </div>

            </section>

       

    </main>

    <script src="../js/sidebar.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
